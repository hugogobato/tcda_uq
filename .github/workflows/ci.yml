name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.10
        run: uv venv --python 3.10

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Verify saved experiment records
        run: uv run --no-sync python reproduction/verify_saved_results.py

      - name: Verify additional public results
        run: uv run --no-sync python reproduction/verify_publication.py

      - name: Check PACCE release scope
        run: uv run --no-sync python reproduction/verify_pacce_release.py

      - name: Build installable wheel
        run: uv build --wheel

      - name: Run fast tests
        run: uv run --no-sync pytest

      - name: Run statistical regression diagnostics
        run: uv run --no-sync pytest -m slow
