name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.10
        run: uv venv --python 3.10

      - name: Install
        run: uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run --no-sync pytest
